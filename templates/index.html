<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación CRUD Flask y MongoDB</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">CRUD Python Flask & MongoDB Atlas</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Columna Izquierda: Formulario para Agregar Producto -->
            <div class="col-md-4">
                <div class="card card-body shadow-sm mb-4">
                    <h5 class="card-title mb-3">Agregar Producto</h5>
                    <form action="/products" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre del Producto</label>
                            <input type="text" name="name" id="name" class="form-control" placeholder="Ej. Laptop" required>
                        </div>
                        <div class="mb-3">
                            <label for="price" class="form-label">Precio ($)</label>
                            <input type="number" step="0.01" name="price" id="price" class="form-control" placeholder="Ej. 999.99" required>
                        </div>
                        <div class="mb-3">
                            <label for="quantity" class="form-label">Cantidad</label>
                            <input type="number" name="quantity" id="quantity" class="form-control" placeholder="Ej. 5" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
                    </form>
                </div>
            </div>

            <!-- Columna Derecha: Lista de Productos Guardados -->
            <div class="col-md-8">
                <h5 class="mb-3">Productos Registrados</h5>
                <div class="row">
                    {% for product in products %}
                        <div class="col-md-6 mb-3">
                            <div class="card card-body shadow-sm">
                                <form action="/edit/{{ product.name }}" method="POST">
                                    <div class="mb-2">
                                        <label class="form-label fw-bold">Nombre:</label>
                                        <input type="text" name="name" value="{{ product.name }}" class="form-control form-control-sm" required>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label fw-bold">Precio ($):</label>
                                        <input type="text" name="price" value="{{ product.price }}" class="form-control form-control-sm" required>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label fw-bold">Cantidad:</label>
                                        <input type="text" name="quantity" value="{{ product.quantity }}" class="form-control form-control-sm" required>
                                    </div>
                                    <div class="d-flex justify-content-between mt-3">
                                        <button type="submit" class="btn btn-sm btn-warning">Editar</button>
                                        <a href="/delete/{{ product.name }}" class="btn btn-sm btn-danger">Eliminar</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    {% else %}
                        <div class="col-12">
                            <div class="alert alert-info">No hay productos registrados aún.</div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

</body>
</html>
